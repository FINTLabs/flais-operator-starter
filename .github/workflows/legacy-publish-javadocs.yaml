name: legacy Deploy Javadoc

on:
  workflow_dispatch:

jobs:
  publish-javadocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Javadoc
        run: ./gradlew javadoc
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: javadocs
          CLEAN: true
          FOLDER: build/docs/javadoc
          TARGET_FOLDER: /
